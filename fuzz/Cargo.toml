[package]
name = "serctl-parser-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
futures-executor = "=0.3.32"
libfuzzer-sys = "=0.4.13"
sha2 = "=0.10.9"
serctl-policy = { path = "../crates/serctl_policy" }
serctl-remote-protocol = { path = "../crates/serctl_remote_protocol" }
serctl-transfer-protocol = { path = "../crates/serctl_transfer_protocol" }

[[bin]]
name = "transfer_protocol"
path = "fuzz_targets/transfer_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "remote_protocol"
path = "fuzz_targets/remote_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "policy_json"
path = "fuzz_targets/policy_json.rs"
test = false
doc = false
bench = false

# Keep fuzz-only dependencies and their lockfile outside the shipped workspace
# graph. Release governance separately proves that no fuzz target is packaged.
[workspace]
members = ["."]
