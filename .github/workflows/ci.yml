name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Re-run RustSec even when the source tree has not changed.
    - cron: "19 19 * * 0"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Formatting, lints, and dependency manifest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report pinned toolchain
        run: |
          rustc --version --verbose
          cargo --version --verbose

      - name: Bind SBOM timestamp to the checked-out commit
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Install pinned dependency policy checker
        run: cargo install cargo-deny --version '=0.20.2' --locked

      - name: Enforce dependency licenses, sources, and manifest policy
        run: cargo deny check bans licenses sources

      - name: Run standalone build-script tests
        run: |
          rustc --edition=2021 --test crates/serctl_cli/build.rs -o target/cli-build-script-tests
          ./target/cli-build-script-tests
          rustc --edition=2021 --test crates/serctl_daemon/build.rs -o target/daemon-build-script-tests
          ./target/daemon-build-script-tests
          rustc --edition=2021 --test crates/serctl_xfer/build.rs -o target/xfer-build-script-tests
          ./target/xfer-build-script-tests

      - name: Generate dependency evidence
        run: |
          cargo metadata --locked --format-version 1 > cargo-metadata.json
          cargo tree --locked --all-features --edges normal,build,dev > cargo-dependency-tree.txt

      - name: Install pinned CycloneDX generator
        run: cargo install cargo-cyclonedx --version '=0.5.9' --locked

      - name: Generate CycloneDX 1.5 SBOMs
        run: |
          cargo cyclonedx --all-features --target all --spec-version 1.5 --format xml --override-filename bom
          cargo cyclonedx --all-features --target all --spec-version 1.5 --format json --override-filename bom

      - name: Upload dependency evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-sbom-and-dependency-manifest
          path: |
            Cargo.lock
            bom.xml
            bom.json
            cargo-metadata.json
            cargo-dependency-tree.txt
          if-no-files-found: error
          retention-days: 30

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report pinned toolchain
        run: |
          rustc --version --verbose
          cargo --version --verbose

      - name: Check all targets and features
        run: cargo check --locked --all-targets --all-features

      - name: Test all targets and features
        run: cargo test --locked --all-targets --all-features -- --test-threads=1

  rustsec:
    name: RustSec advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version '=0.22.2' --locked

      - name: Audit Cargo.lock against the online RustSec database
        run: cargo audit --deny warnings

  release:
    name: Windows release artifact
    needs: [quality, test, rustsec]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bind release timestamp to the checked-out commit
        shell: pwsh
        run: |
          "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build optimized release from the checked-out commit
        # Production artifacts must never enable serctl-core/test-support.
        # Build only the shipped binaries with their normal feature sets.
        run: cargo build --locked --release --workspace --bins

      - name: Verify embedded clean commit and record release evidence
        shell: pwsh
        run: |
          $expected = "${{ github.sha }}".Substring(0, 12)
          $cliVersion = & .\target\release\serctl_cli.exe --version
          $daemonVersion = & .\target\release\serctl_daemon.exe --version
          $helperVersion = & .\target\release\serctl-xfer.exe --version
          $packageVersion = ($cliVersion -split ' ')[1]
          $versions = @{
            cli = $cliVersion
            daemon = $daemonVersion
            helper = $helperVersion
          }
          foreach ($entry in $versions.GetEnumerator()) {
            if (-not $entry.Value.Contains("git $expected")) {
              throw "$($entry.Key) version does not identify the checked-out commit: $($entry.Value)"
            }
            if ($entry.Value -match "-dirty") {
              throw "$($entry.Key) version unexpectedly reports a dirty worktree: $($entry.Value)"
            }
            if ($entry.Value -notmatch " $([regex]::Escape($packageVersion)) ") {
              throw "$($entry.Key) version does not match package version ${packageVersion}: $($entry.Value)"
            }
          }
          if (-not $daemonVersion.Contains("IPC v8..=v8")) {
            throw "daemon does not report the required IPC range: $daemonVersion"
          }
          if (-not $helperVersion.Contains("transfer protocol v1")) {
            throw "helper does not report the required transfer protocol: $helperVersion"
          }
          Get-FileHash .\target\release\serctl_cli.exe, .\target\release\serctl_cli.pdb, .\target\release\serctl_daemon.exe, .\target\release\serctl_daemon.pdb, .\target\release\serctl-xfer.exe, .\target\release\serctl_xfer.pdb -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Path release-sha256.txt -Encoding utf8
          @(
            "commit=${{ github.sha }}"
            "event=${{ github.event_name }}"
            "ref=${{ github.ref }}"
            "runner_image=$env:ImageOS-$env:ImageVersion"
            "rustc=$(& rustc --version)"
            "cargo=$(& cargo --version)"
            "cli_version=$cliVersion"
            "daemon_version=$daemonVersion"
            "helper_version=$helperVersion"
          ) | Out-File release-environment.txt

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-${{ github.sha }}
          path: |
            target/release/serctl_cli.exe
            target/release/serctl_cli.pdb
            target/release/serctl_daemon.exe
            target/release/serctl_daemon.pdb
            target/release/serctl-xfer.exe
            target/release/serctl_xfer.pdb
            release-sha256.txt
            release-environment.txt
          if-no-files-found: error
          retention-days: 30
