[package]
name = "serctl"
version = "0.1.0"
edition = "2021"
description = "Persistent SSH control suite: encrypted credentials, long-lived connection daemon, IPC command execution."

[dependencies]
tokio = { version = "1", features = ["full"] }
russh = "0.50"
russh-sftp = "2.4"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
rpassword = "7"
anyhow = "1"
crossterm = "0.28"
async-trait = "0.1"
log = "0.4"
env_logger = "0.11"
sha2 = "0.10"
hex = "0.4"
atomic-write-file = "0.3"
fs2 = "0.4"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
winit = "0.30"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }
