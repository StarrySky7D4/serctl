[package]
name = "serctl-core"
description = "serctl shared foundation: encrypted credential vault, recovery, protected files, and the SSH/SFTP engine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Compiles test-only helpers (set_test_home, fixed call keys, direct decrypt)
# that other crates' test suites need across the package boundary.
test-support = []

[dependencies]
serctl-protocol.workspace = true
tokio.workspace = true
tokio-util.workspace = true
russh.workspace = true
russh-sftp.workspace = true
serde.workspace = true
serde_json.workspace = true
argon2.workspace = true
chacha20poly1305.workspace = true
curve25519-dalek.workspace = true
hkdf.workspace = true
rand.workspace = true
base64.workspace = true
bytes.workspace = true
anyhow.workspace = true
log.workspace = true
sha2.workspace = true
hmac.workspace = true
hex.workspace = true
atomic-write-file.workspace = true
fs2.workspace = true
zeroize.workspace = true
subtle.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
