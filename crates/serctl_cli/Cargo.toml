[package]
name = "serctl-cli"
description = "serctl command line, desktop UI, daemon launcher, and Agent gateway."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "serctl_cli"
path = "src/main.rs"

[dependencies]
serctl-core = { version = "0.3.0-beta.2", path = "../serctl_core" }
serctl-protocol = { version = "0.3.0-beta.2", path = "../serctl_protocol" }
tokio.workspace = true
tokio-util.workspace = true
russh.workspace = true
russh-sftp.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
rpassword.workspace = true
anyhow.workspace = true
crossterm.workspace = true
log.workspace = true
env_logger.workspace = true
hex.workspace = true
sha2.workspace = true
zeroize.workspace = true
subtle.workspace = true
eframe.workspace = true
winit.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
serctl-core = { version = "0.3.0-beta.2", path = "../serctl_core", features = ["test-support"] }
serctl-daemon = { version = "0.3.0-beta.2", path = "../serctl_daemon" }
serctl-transfer-protocol = { version = "0.3.0-beta.2", path = "../serctl_transfer_protocol" }
